<div id="project-actions" class="mt-3 d-flex gap-2 flex-wrap"{% if oob %} hx-swap-oob="true"{% endif %}>
  <a href="{{ tenant_base }}{% url 'viewer:view' project.pk %}" class="btn btn-outline-info btn-sm" target="_blank">
    <i class="bi bi-eye me-1"></i>View
  </a>
  {% if perms.can_validate %}
  <button class="btn btn-outline-primary btn-sm"
          hx-post="{{ tenant_base }}{% url 'validation:validate' project.pk %}"
          hx-target="#validation-result"
          hx-swap="innerHTML"
          onclick="this.disabled=true;this.querySelector('.spinner').classList.remove('d-none')"
          hx-on::after-request="this.disabled=false;this.querySelector('.spinner').classList.add('d-none')">
    <span><i class="bi bi-check-circle me-1"></i>Validate</span>
    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
  </button>
  {% endif %}
  {% if perms.can_publish %}
  <button class="btn btn-outline-success btn-sm"
          hx-post="{{ tenant_base }}{% url 'projects:publish' project.pk %}"
          hx-target="#publish-result"
          hx-swap="innerHTML"
          onclick="this.disabled=true;this.querySelector('.spinner').classList.remove('d-none')"
          hx-on::after-request="this.disabled=false;this.querySelector('.spinner').classList.add('d-none')">
    <span><i class="bi bi-cloud-upload me-1"></i>Publish</span>
    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
  </button>
  {% endif %}
  {% if perms.can_unpublish %}
  <button class="btn btn-outline-warning btn-sm"
          hx-post="{{ tenant_base }}{% url 'projects:unpublish' project.pk %}"
          hx-target="#publish-result"
          hx-swap="innerHTML"
          onclick="this.disabled=true;this.querySelector('.spinner').classList.remove('d-none')"
          hx-on::after-request="this.disabled=false;this.querySelector('.spinner').classList.add('d-none')">
    <span><i class="bi bi-cloud-arrow-down me-1"></i>Unpublish</span>
    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
  </button>
  {% endif %}
  {% if perms.can_reactivate %}
  <button class="btn btn-outline-success btn-sm"
          hx-post="{{ tenant_base }}{% url 'projects:reactivate' project.pk %}"
          hx-target="#publish-result"
          hx-swap="innerHTML"
          onclick="this.disabled=true;this.querySelector('.spinner').classList.remove('d-none')"
          hx-on::after-request="this.disabled=false;this.querySelector('.spinner').classList.add('d-none')">
    <span><i class="bi bi-arrow-counterclockwise me-1"></i>Re-activate</span>
    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
  </button>
  {% endif %}
  {% if perms.can_replace %}
  <button class="btn btn-outline-secondary btn-sm"
          hx-get="{{ tenant_base }}{% url 'projects:replace' project.pk %}"
          hx-target="#replace-form"
          hx-swap="innerHTML">
    <i class="bi bi-arrow-repeat me-1"></i>Replace file
  </button>
  {% endif %}
  {% if perms.can_delete %}
  <a href="{{ tenant_base }}{% url 'projects:delete' project.pk %}" class="btn btn-outline-danger btn-sm"
     hx-get="{{ tenant_base }}{% url 'projects:delete' project.pk %}"
     hx-target="#main-content"
     hx-swap="innerHTML">
    <i class="bi bi-trash me-1"></i>Delete
  </a>
  {% endif %}
</div>
