<div id="replace-form" class="mt-3">
  <div class="alert alert-secondary py-2 px-3 mb-2" style="font-size: 0.85rem;">
    <i class="bi bi-arrow-repeat me-1"></i>
    Replacing the file resets the project to <strong>Draft</strong> (auto-unpublish), bumps the
    version to {{ project.version|add:"1" }}, and clears publish info. You must validate and
    publish again.
  </div>
  {% if error %}
  <div class="alert alert-danger py-2 px-3">{{ error }}</div>
  {% endif %}
  <form hx-post="{{ tenant_base }}{% url 'projects:replace' project.pk %}"
        hx-target="#replace-form"
        hx-swap="innerHTML"
        hx-encoding="multipart/form-data"
        class="d-flex gap-2 align-items-center">
    <input type="file" name="file" class="form-control form-control-sm" accept=".qgz,.zip" required>
    <button type="submit" class="btn btn-primary btn-sm">Upload replacement</button>
    <button type="button" class="btn btn-outline-secondary btn-sm"
            onclick="document.getElementById('replace-form').innerHTML=''">Cancel</button>
  </form>
</div>
