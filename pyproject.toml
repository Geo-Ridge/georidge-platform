[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*", "*/__pycache__/*", ".git/*"]

[tool.ruff.lint]
# E4/E7/E9: imports, statements, runtime errors. F: pyflakes (unused imports,
# undefined names). I: import sorting.
select = ["E4", "E7", "E9", "F", "I"]
# E501: line length is not enforced (existing code exceeds 120). F403/F405:
# Django settings modules use `from .base import *` by design.
ignore = ["E501", "F403", "F405"]
